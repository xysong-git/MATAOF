[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mataof"
version = "0.1.0"
description = "面向时序数据库的多智能体自适应查询优化系统"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["sqlglot>=25.0"]

[project.scripts]
mataof = "mataof.cli:main"

[tool.setuptools.packages.find]
include = ["mataof*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
